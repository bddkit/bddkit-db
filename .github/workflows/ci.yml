name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a released bddkit. Raise it when a
  # newer release is out.
  HOST_TAG: v0.5.0

jobs:
  test:
    # The suites in tests/db.rs and tests/db_host.rs run against one engine at
    # a time; the other test binaries and the lints do not care which.
    name: test & clippy (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, mariadb]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apibdd_it
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apibdd_it
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
        if: matrix.engine == 'postgres'
      - name: File size budget
        if: matrix.engine == 'postgres'
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: matrix.engine == 'postgres'

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ~/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}
      - name: Install the host
        if: steps.host.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root ~/bddkit-host bddkit

      # The databases above are shared test fixtures, so the suites run
      # single-threaded.
      - name: Tests
        env:
          BDDKIT_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5433/postgres
          BDDKIT_TEST_MYSQL_DSN: mysql://root:root@127.0.0.1:3307/apibdd_it
          BDDKIT_TEST_MARIADB_DSN: mysql://root:root@127.0.0.1:3308/apibdd_it
          BDDKIT_TEST_ENGINE: ${{ matrix.engine }}
        run: |
          export BDDKIT_BIN="$HOME/bddkit-host/bin/bddkit"
          cargo test --locked -- --test-threads=1

      # The examples are the demonstration surface: without this they rot.
      # The service containers start before the checkout, so the init scripts
      # are applied by hand, and each suite runs from the root as the README says.
      - name: Examples
        if: matrix.engine == 'postgres'
        run: |
          export BDDKIT_BIN="$HOME/bddkit-host/bin/bddkit"
          psql -v ON_ERROR_STOP=1 postgres://postgres:postgres@127.0.0.1:5433/postgres -f examples/db/init.sql
          mysql --protocol=TCP -h127.0.0.1 -P3307 -uroot -proot < examples/db/init-mysql.sql
          mysql --protocol=TCP -h127.0.0.1 -P3308 -uroot -proot < examples/db/init-mysql.sql
          mysql --protocol=TCP -h127.0.0.1 -P3308 -uroot -proot < examples/db/init-mariadb.sql
          cargo build --locked
          lock="$RUNNER_TEMP/lock"
          mkdir -p "$lock"
          printf 'plugin:\n  - name: db\n    path: %s/target/debug/libbddkit_db.so\n' "$PWD" > "$lock/plugins.yaml"
          code=0
          for suite in db db-mysql db-mariadb; do
            "$BDDKIT_BIN" run --config "examples/$suite.yaml" --bddkit-dir "$lock" || code=1
          done
          exit "$code"

  # Release gate (epic bddkit/bddkit#183, phase 6): the core's DB example suites
  # exactly as they were at the `pre-split` tag pass on the released host with
  # this plugin installed. Nothing of the suites is edited, so the `api` resource
  # they still declare needs the api plugin: it is installed the way a user
  # would, from its pre-release. Raise API_TAG with the API candidate.
  pre-split-gate:
    name: pre-split DB suites
    runs-on: ubuntu-latest
    env:
      API_TAG: 0.1.0-rc.1

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apibdd_it
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apibdd_it
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      - name: Check out the core at pre-split
        uses: actions/checkout@v6
        with:
          repository: bddkit/bddkit
          ref: pre-split
          path: core

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ~/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}
      - name: Install the host
        if: steps.host.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root ~/bddkit-host bddkit

      - name: Run the suites
        run: |
          bddkit="$HOME/bddkit-host/bin/bddkit"
          cargo build --locked
          lock="$RUNNER_TEMP/lock"
          mkdir -p "$lock"
          "$bddkit" plugin install "bddkit/bddkit-api@$API_TAG" --bddkit-dir "$lock"
          printf -- '- name: db\n  path: %s/target/debug/libbddkit_db.so\n' "$PWD" >> "$lock/plugins.yaml"
          cd core
          psql -v ON_ERROR_STOP=1 postgres://postgres:postgres@127.0.0.1:5433/postgres -f examples/db/init.sql
          mysql --protocol=TCP -h127.0.0.1 -P3307 -uroot -proot < examples/db/init-mysql.sql
          mysql --protocol=TCP -h127.0.0.1 -P3308 -uroot -proot < examples/db/init-mysql.sql
          mysql --protocol=TCP -h127.0.0.1 -P3308 -uroot -proot < examples/db/init-mariadb.sql
          code=0
          for suite in db db-mysql db-mariadb; do
            "$bddkit" run --config "examples/$suite.yaml" --bddkit-dir "$lock" || code=1
          done
          exit "$code"
